<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ऋग्वेद संहिता</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8B0000">
<link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-head">
    <h1>ऋग्वेद संहिता</h1>
    <button id="headerToggle" class="header-toggle" type="button" aria-label="Hide header">
      <span class="chevron">»</span>
    </button>
  </div>

  <div id="topbarContent" class="topbar-content">
    <div class="search-toolbar">
      <input
        id="search"
        type="text"
        placeholder="Search in Devanagari or transliteration..."
        autocomplete="off"
      />
      <button id="filterBtn" type="button">Filter</button>
    </div>

<div class="nav-toolbar">

  <div class="nav-buttons">
    <button id="prevTop" class="nav-btn">← Prev</button>
    <button id="shareBtn" class="nav-btn" type="button">Share</button>
    <button id="copyAllBtn" class="nav-btn" type="button">Copy Page</button>
    <button id="nextTop" class="nav-btn">Next →</button>
  </div>

  <div id="pageInfo" class="page-info">
    Loading...
  </div>

</div>
<div class="options-toolbar">
  <button id="togglePadaBtn" type="button">पद पाठ: OFF</button>

  <select id="jumpMode">
    <label for="jumpMode">प्रकार</label>
    <option value="rik">मण्डल/सुक्त</option>
    <option value="ashtaka">अष्टक/अध्याय/वर्ग</option>
  </select>

  <div class="input-list-wrapper">
    <label for="jump1" id="lblJump1"></label> <input id="jump1" list="listJump1" type="number" min="1" value="1" placeholder="मण्डल" autocomplete="off" />
    <datalist id="listJump1"></datalist>
  </div>

  <div class="input-list-wrapper">
    <label for="jump2" id="lblJump2"></label> <input id="jump2" list="listJump2" type="number" min="1" value="1" placeholder="सूक्त" autocomplete="off" />
    <datalist id="listJump2"></datalist>
  </div>
  
  <div class="input-list-wrapper hidden" id="wrapperJump3">
    <label for="jump3" id="lblJump3"></label> <input id="jump3" list="listJump3" type="number" min="1" value="1" placeholder="वर्ग" autocomplete="off" />
    <datalist id="listJump3"></datalist>
  </div>

  <button id="jumpGo" type="button">Go</button>


  </div>
  <div class="script-selector">
  <label for="scriptSelect">Script:</label>
  <select id="scriptSelect">
    <option value="devanagari" selected>देवनागरी</option>
    <option value="kannada">ಕನ್ನಡ</option>
    <option value="telugu">తెలుగు</option>
  </select>
</div>

    <div id="status">Loading...</div>
  <div id="filterModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Search Filters</h2>
        <button id="closeFilterModal" class="close-btn" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="filter-group">
          <label for="filterAshtaka">Ashtaka:</label>
          <select id="filterAshtaka">
            <option value="">All</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterAdhyaya">Adhyaya:</label>
          <select id="filterAdhyaya" disabled>
            <option value="">All</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filterMandala">Mandala:</label>
          <select id="filterMandala">
            <option value="">All</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="clearFiltersBtn" type="button" class="secondary-btn">Clear Filters</button>
        <button id="applyFiltersBtn" type="button" class="primary-btn">Apply Filters</button>
      </div>
    </div>
  </div>
</header>
  <main>
    <div id="results"></div>
    <div id="scrollSentinel" aria-hidden="true"></div>

    <div class="reader-toolbar bottom-toolbar">
      <button id="prevBottom">← Previous Sukta</button>
      <div id="pageInfoBottom" class="page-info">Loading...</div>
      <button id="nextBottom">Next Sukta →</button>
    </div>
  </main>

  <script src="app.js"></script>

  <footer class="footer" align="center">
    <div>
      Developed by
      <a href="https://abhi-glitchhg.github.io/" target="_blank">
        Abhijit Deo
      </a>
    </div>

    <div>
      <a href="https://deeplearningforsanskrit.github.io/" target="_blank">
        Project Website
      </a>
    </div>

    <div class="tagline">
      वन्दे गुरु परम्पराम्
    </div>
  </footer>

  <aside id="pwaInstallPrompt" class="pwa-install-prompt" aria-labelledby="pwaInstallTitle" aria-describedby="pwaInstallDescription" hidden>
    <button id="pwaInstallClose" class="pwa-install-close" type="button" aria-label="Dismiss install suggestion">&times;</button>
    <div class="pwa-install-icon" aria-hidden="true">ऋ</div>
    <div class="pwa-install-copy">
      <strong id="pwaInstallTitle">Read Rigveda Samhita anywhere</strong>
      <p id="pwaInstallDescription">Add the reader to your device for quick access and offline reading.</p>
      <div id="pwaInstallGuide" class="pwa-install-guide" hidden>
        <p id="pwaInstallGuideIntro"></p>
        <ol id="pwaInstallSteps"></ol>
      </div>
      <div class="pwa-install-actions">
        <button id="pwaInstallButton" class="pwa-install-button" type="button">How to install</button>
        <button id="pwaInstallLater" class="pwa-install-later" type="button">Not now</button>
      </div>
    </div>
  </aside>

  <script>
  // Offer the browser's native PWA install dialog when available. Otherwise,
  // show concise, platform-specific steps without pretending browser menus
  // can be controlled by a webpage.
  (() => {
    const promptEl = document.getElementById('pwaInstallPrompt');
    const installButton = document.getElementById('pwaInstallButton');
    const guideEl = document.getElementById('pwaInstallGuide');
    const guideIntro = document.getElementById('pwaInstallGuideIntro');
    const stepsEl = document.getElementById('pwaInstallSteps');
    const descriptionEl = document.getElementById('pwaInstallDescription');
    const closeButton = document.getElementById('pwaInstallClose');
    const laterButton = document.getElementById('pwaInstallLater');
    if (!promptEl || !installButton || !guideEl || !stepsEl) return;

    const DISMISS_KEY = 'rigveda-pwa-install-dismissed-until';
    const DISMISS_DAYS = 30;
    const ua = navigator.userAgent;
    const isIOS = /iphone|ipad|ipod/i.test(ua)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari = isIOS && /safari/i.test(ua) && !/crios|fxios|edgios|opios/i.test(ua);
    const isAndroid = /android/i.test(ua);
    const isSamsung = /samsungbrowser/i.test(ua);
    const isChrome = /chrome|crios/i.test(ua) && !/edg|opr|samsungbrowser/i.test(ua);
    const isEdge = /edg/i.test(ua);
    const isFirefox = /firefox|fxios/i.test(ua);
    let deferredInstallPrompt = null;
    let isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;

    const wasDismissed = () => {
      try { return Number(localStorage.getItem(DISMISS_KEY) || 0) > Date.now(); }
      catch (_) { return false; }
    };
    const dismiss = () => {
      promptEl.hidden = true;
      try { localStorage.setItem(DISMISS_KEY, String(Date.now() + DISMISS_DAYS * 86400000)); }
      catch (_) { /* Storage may be unavailable. */ }
    };
    const showPrompt = () => {
      if (!isStandalone && !wasDismissed()) promptEl.hidden = false;
    };
    const showGuide = () => {
      guideEl.hidden = false;
      installButton.textContent = 'Got it';
      laterButton.textContent = 'Close';
      if (isIOS && isSafari) {
        guideIntro.textContent = 'In Safari, add this reader to your Home Screen:';
        stepsEl.innerHTML = '<li>Tap the <strong>Share</strong> button <span class="pwa-share-symbol" aria-label="Share">↑</span> at the bottom of Safari (or top on iPad).</li><li>Scroll the share sheet and tap <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong> to finish.</li>';
      } else if (isIOS) {
        guideIntro.textContent = 'To install on iPhone or iPad, open this page in Safari:';
        stepsEl.innerHTML = '<li>Copy this page address and open it in <strong>Safari</strong>.</li><li>Tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li>';
      } else if (isAndroid && isSamsung) {
        guideIntro.textContent = 'In Samsung Internet:';
        stepsEl.innerHTML = '<li>Open the browser menu (☰).</li><li>Choose <strong>Add page to</strong>, then <strong>Home screen</strong> (wording may vary).</li>';
      } else if (isAndroid && isChrome) {
        guideIntro.textContent = 'In Chrome for Android:';
        stepsEl.innerHTML = '<li>Tap the three-dot menu (⋮) in the top-right corner.</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li><li>Confirm by tapping <strong>Install</strong> or <strong>Add</strong>.</li>';
      } else if (!isAndroid && (isChrome || isEdge)) {
        guideIntro.textContent = 'In your desktop browser:';
        stepsEl.innerHTML = '<li>Look for the install icon in the address bar and select it, or open the browser menu (⋮).</li><li>Choose <strong>Install Rigveda Samhita</strong> or <strong>Apps → Install this site as an app</strong>.</li><li>Confirm the installation.</li>';
      } else if (isAndroid && isFirefox) {
        guideIntro.textContent = 'Installation options depend on your Firefox version:';
        stepsEl.innerHTML = '<li>Open the browser menu (⋮).</li><li>If available, choose <strong>Install</strong> or <strong>Add to Home screen</strong>.</li><li>If no install option appears, open this page in Chrome for the native install experience.</li>';
      } else {
        guideIntro.textContent = 'Use a browser that supports installing web apps:';
        stepsEl.innerHTML = '<li>On Android, open this page in <strong>Chrome</strong>.</li><li>On desktop, use <strong>Chrome</strong> or <strong>Edge</strong>.</li><li>Use the browser menu or address-bar install icon to install the app.</li>';
      }
    };

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.textContent = 'Install app';
      guideEl.hidden = true;
      showPrompt();
    });

    window.addEventListener('appinstalled', () => {
      isStandalone = true;
      promptEl.hidden = true;
      deferredInstallPrompt = null;
    });

    installButton.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        const installEvent = deferredInstallPrompt;
        deferredInstallPrompt = null;
        installEvent.prompt();
        const choice = await installEvent.userChoice;
        if (choice && choice.outcome === 'accepted') {
          promptEl.hidden = true;
          return;
        }
        // A dismissed native dialog cannot be opened a second time; offer
        // the appropriate browser instructions instead.
        descriptionEl.textContent = 'You can install it whenever you are ready:';
        showGuide();
        return;
      }
      if (guideEl.hidden) {
        descriptionEl.textContent = 'Follow these steps in your browser:';
        showGuide();
      } else {
        promptEl.hidden = true;
      }
    });

    closeButton.addEventListener('click', dismiss);
    laterButton.addEventListener('click', dismiss);

    if (!isStandalone && !wasDismissed()) window.setTimeout(showPrompt, 5000);
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('./sw.js', {
          scope: '/rigveda-samhita/'
        });
        console.log('[Page] SW registered, scope:', reg.scope);

        // When online: tell the active SW to re-check the version.
        // The SW will delete stale caches and re-cache if the version changed.
        if (navigator.onLine && reg.active) {
          reg.active.postMessage({ type: 'CHECK_UPDATE' });
        }

        // Also handle the case where a brand-new SW just finished activating
        // (e.g. first load or after an update) — reload so the page uses the
        // freshly cached assets.
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

      } catch (err) {
        console.error('[Page] SW registration failed:', err);
      }
    });
  }
</script>
</body>
</html>
