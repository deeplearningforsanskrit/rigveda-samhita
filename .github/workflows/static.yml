# Deploy the production reader together with isolated, live previews for every open PR.
name: Deploy GitHub Pages (production + PR previews)

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build production site and all open PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Build the normal production Sūkta preview pages first.
          python scripts/generate_previews.py

          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/

          # Rebuild every currently open same-repository PR preview on each
          # deployment. This keeps previews available together and removes
          # them automatically after a PR is closed.
          while IFS= read -r pr_number; do
            [ -n "$pr_number" ] || continue
            echo "Building preview for PR #${pr_number}"
            git fetch --no-tags --depth=1 origin "refs/pull/${pr_number}/head"
            preview_dir="_site/pr-preview/pr-${pr_number}"
            mkdir -p "$preview_dir"
            git archive FETCH_HEAD | tar -x -C "$preview_dir"

            # Generate this PR version's Sūkta preview pages inside its own
            # isolated folder; never alter the production files.
            python "$preview_dir/scripts/generate_previews.py"
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .number'
          )

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish PR preview link
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-link -->';
            const number = context.issue.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${number}/`;
            const closed = context.payload.action === 'closed';
            const body = closed
              ? `${marker}\n**Live preview removed.** PR #${number} is closed.`
              : `${marker}\n**Live preview:** [Open PR #${number} website] (${url})\n\nThis preview updates automatically when new commits are pushed to this PR.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else if (!closed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body
              });
            }
