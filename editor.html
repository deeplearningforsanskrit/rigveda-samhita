<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vedic Swar Editor</title>

<style>
body {
    font-family: "Noto Sans Devanagari", sans-serif;
    margin: 20px;
}

textarea {
    width: 100%;
    height: 300px;
    font-size: 32px;
}

button {
    margin: 10px 0;
    padding: 8px 12px;
    font-size: 16px;
}
</style>
</head>

<body>

<h2>Vedic Swar Editor</h2>

<p>
Alt+↑ = ॑ (Udātta)<br>
Alt+↓ = ॒ (Anudātta)<br>
Alt+Delete = Remove swara
</p>

<button onclick="removeSpaces()">Remove All Spaces</button>

<textarea id="editor"></textarea>

<script>

const UDATTA   = "\u0951"; // ॑
const ANUDATTA = "\u0952"; // ॒

const editor = document.getElementById("editor");

editor.addEventListener("keydown", (e) => {

    if (!e.altKey) return;

    let start = editor.selectionStart;

    if (e.key === "ArrowUp") {
        e.preventDefault();
        insertMark(UDATTA);
    }

    if (e.key === "ArrowDown") {
        e.preventDefault();
        insertMark(ANUDATTA);
    }

    if (e.key === "Delete") {
        e.preventDefault();
        removeMark();
    }

    function insertMark(mark) {
        let text = editor.value;

        // insert WITHOUT deleting other swaras
        editor.value =
            text.slice(0, start) +
            mark +
            text.slice(start);

        editor.selectionStart =
        editor.selectionEnd = start + 1;
    }

    function removeMark() {
        let text = editor.value;

        if (
            text[start - 1] === UDATTA ||
            text[start - 1] === ANUDATTA
        ) {
            editor.value =
                text.slice(0, start - 1) +
                text.slice(start);

            editor.selectionStart =
            editor.selectionEnd = start - 1;
        }
    }
});

// Remove spaces (unchanged)
function removeSpaces() {
    editor.value = editor.value.replace(/ /g, "");
}

</script>
</body>
</html>
